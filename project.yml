name: CommandCenter
options:
  bundleIdPrefix: dev.commandcenter
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CommandCenter:
    type: application
    platform: macOS
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    sources:
      - path: CommandCenter
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: GRDB
      - package: SwiftTerm
      - sdk: EventKit.framework
      - sdk: IOKit.framework
      - sdk: Carbon.framework
      - sdk: JavaScriptCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.commandcenter.app
        PRODUCT_NAME: Command Center
        INFOPLIST_FILE: CommandCenter/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CommandCenter/Resources/CommandCenter.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CommandCenterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CommandCenterTests]
    dependencies:
      - target: CommandCenter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.commandcenter.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Command Center.app/Contents/MacOS/Command Center"
schemes:
  CommandCenter:
    build:
      targets:
        CommandCenter: all
        CommandCenterTests: [test]
    test:
      targets: [CommandCenterTests]
      environmentVariables:
        CC_DATA_DIR: /tmp/CommandCenterTests-data
